<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="dark light" />
    <meta name="theme-color" content="#080809" media="(prefers-color-scheme: dark)" />
    <meta name="theme-color" content="#faf5e4" media="(prefers-color-scheme: light)" />
    <meta name="author" content="David Mészáros" />
    <!-- GitHub Pages can't send security headers, so the parts that work as <meta> live here.
         connect-src lists every endpoint the site talks to: add new APIs here or they're blocked. -->
    <meta http-equiv="Content-Security-Policy" content="object-src 'none'; base-uri 'self'; form-action 'self' https://api.web3forms.com; connect-src 'self' data: blob: https://api.web3forms.com https://softwaredevelopment-counter.punkboy40.workers.dev https://softwaredevelopment-site-check.punkboy40.workers.dev https://cloudflareinsights.com; upgrade-insecure-requests" />
    <meta name="referrer" content="strict-origin-when-cross-origin" />
    <!-- the saved theme, before the first paint of the prerendered page -->
    <script>try{if(localStorage.getItem('dm.theme')==='light')document.documentElement.dataset.theme='light'}catch(e){}</script>
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <!-- title, description, canonical, social preview tags and structured data
         are written per page by scripts/seo.ts -->
    <!--seo-->
    <title>Dávid Mészáros</title>
    <!--/seo-->
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <!-- Cloudflare Web Analytics: cookieless visitor statistics, so no consent banner is needed -->
    <script type="module" src="https://static.cloudflareinsights.com/beacon.min.js" data-cf-beacon='{"token": "194cd6f1ac46471eb4ff6f4d6ab95275"}'></script>
  </body>
</html>
